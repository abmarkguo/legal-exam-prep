<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3a5c"/><stop offset="1" stop-color="#122a44"/>
    </linearGradient>
  </defs>
  <rect width="680" height="460" fill="#f5f7fa"/>
  <rect x="0" y="0" width="680" height="52" fill="url(#navy)"/>
  <text x="340" y="33" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Question Types 题型分布</text>

  <!-- Objective column -->
  <rect x="40" y="80" width="290" height="340" rx="12" fill="#ffffff" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="40" y="80" width="290" height="38" rx="12" fill="#1a3a5c"/>
  <text x="185" y="105" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">Objective 客观题 (300 pts)</text>

  <g>
    <rect x="60" y="134" width="250" height="56" rx="8" fill="#eef3f8"/>
    <text x="75" y="158" fill="#1a3a5c" font-size="14" font-weight="bold">Single Choice 单选</text>
    <text x="75" y="178" fill="#5a6b7b" font-size="12">≈50 Q · 1 pt each</text>

    <rect x="60" y="202" width="250" height="56" rx="8" fill="#eef3f8"/>
    <text x="75" y="226" fill="#1a3a5c" font-size="14" font-weight="bold">Multiple Choice 多选</text>
    <text x="75" y="246" fill="#5a6b7b" font-size="12">≈35 Q · 2 pt each · all-or-nothing</text>

    <rect x="60" y="270" width="250" height="56" rx="8" fill="#eef3f8"/>
    <text x="75" y="294" fill="#1a3a5c" font-size="14" font-weight="bold">Indefinite 不定项</text>
    <text x="75" y="314" fill="#5a6b7b" font-size="12">≈15 Q · 2 pt · case-based</text>

    <rect x="60" y="338" width="250" height="60" rx="8" fill="#fff4d6" stroke="#c9a227"/>
    <text x="75" y="362" fill="#8a6d10" font-size="13" font-weight="bold">Note 说明</text>
    <text x="75" y="382" fill="#8a6d10" font-size="11">2018+ : no official</text>
    <text x="75" y="396" fill="#8a6d10" font-size="11">questions released</text>
  </g>

  <!-- Subjective column -->
  <rect x="350" y="80" width="290" height="340" rx="12" fill="#ffffff" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="350" y="80" width="290" height="38" rx="12" fill="#c9a227"/>
  <text x="495" y="105" text-anchor="middle" fill="#1a2233" font-size="15" font-weight="bold">Subjective 主观题 (180 pts)</text>

  <g>
    <rect x="370" y="134" width="250" height="56" rx="8" fill="#eef3f8"/>
    <text x="385" y="158" fill="#1a3a5c" font-size="14" font-weight="bold">Case Analysis 案例分析</text>
    <text x="385" y="178" fill="#5a6b7b" font-size="12">刑法/民法/商法/行政法/民诉</text>

    <rect x="370" y="202" width="250" height="56" rx="8" fill="#eef3f8"/>
    <text x="385" y="226" fill="#1a3a5c" font-size="14" font-weight="bold">Legal Document 文书</text>
    <text x="385" y="246" fill="#5a6b7b" font-size="12">起诉状/答辩状/代理词/判决</text>

    <rect x="370" y="270" width="250" height="56" rx="8" fill="#eef3f8"/>
    <text x="385" y="294" fill="#1a3a5c" font-size="14" font-weight="bold">Essay 论述</text>
    <text x="385" y="314" fill="#5a6b7b" font-size="12">习近平法治思想 / 法理</text>

    <rect x="370" y="338" width="250" height="60" rx="8" fill="#fff4d6" stroke="#c9a227"/>
    <text x="385" y="362" fill="#8a6d10" font-size="13" font-weight="bold">Format 要求</text>
    <text x="385" y="382" fill="#8a6d10" font-size="11">结论+依据+分析+重申</text>
    <text x="385" y="396" fill="#8a6d10" font-size="11">"裸结论"不得分</text>
  </g>
</svg>
