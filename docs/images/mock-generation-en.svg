  <text x="130" y="284" text-anchor="middle" fill="#1a3a5c" font-size="13" font-weight="bold">Trends 命题趋势</text>
  <text x="130" y="304" text-anchor="middle" fill="#5a6b7b" font-size="11">高频/易错</text>

