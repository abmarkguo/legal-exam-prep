  <rect x="270" y="160" width="160" height="80" rx="12" fill="url(#navy)"/>
  <text x="350" y="192" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Generation</text>
  <text x="350" y="212" text-anchor="middle" fill="#c9d6e3" font-size="12">命制引擎</text>

  <line x1="220" y1="128" x2="268" y2="178" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="220" y1="208" x2="268" y2="200" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="220" y1="288" x2="268" y2="222" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow3)"/>

