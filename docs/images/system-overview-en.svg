<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="Segoe UI, Arial, sans-serif" width="680" height="460">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3a5c"/>
      <stop offset="1" stop-color="#122a44"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0b63a"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <rect width="680" height="460" fill="#f5f7fa"/>
  <rect x="0" y="0" width="680" height="56" fill="url(#navy)"/>
  <text x="340" y="35" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">Legal Exam Prep Skill — System Overview</text>

  <!-- Central hub -->
  <rect x="250" y="190" width="180" height="60" rx="10" fill="url(#gold)"/>
  <text x="340" y="214" text-anchor="middle" fill="#1a2233" font-size="15" font-weight="bold">Chinese Bar Exam</text>
  <text x="340" y="234" text-anchor="middle" fill="#1a2233" font-size="12">法考备考系统</text>

  <!-- Four modules -->
  <rect x="40" y="100" width="150" height="64" rx="9" fill="#ffffff" stroke="#1a3a5c" stroke-width="2"/>
  <text x="115" y="128" text-anchor="middle" fill="#1a3a5c" font-size="14" font-weight="bold">1. Knowledge</text>
  <text x="115" y="148" text-anchor="middle" fill="#1a3a5c" font-size="13">Lookup 考点速查</text>

  <rect x="490" y="100" width="150" height="64" rx="9" fill="#ffffff" stroke="#1a3a5c" stroke-width="2"/>
  <text x="565" y="128" text-anchor="middle" fill="#1a3a5c" font-size="14" font-weight="bold">2. Objective</text>
  <text x="565" y="148" text-anchor="middle" fill="#1a3a5c" font-size="13">Practice 客观题</text>

  <rect x="40" y="300" width="150" height="64" rx="9" fill="#ffffff" stroke="#1a3a5c" stroke-width="2"/>
  <text x="115" y="328" text-anchor="middle" fill="#1a3a5c" font-size="14" font-weight="bold">3. Subjective</text>
  <text x="115" y="348" text-anchor="middle" fill="#1a3a5c" font-size="13">Training 主观题</text>

  <rect x="490" y="300" width="150" height="64" rx="9" fill="#ffffff" stroke="#1a3a5c" stroke-width="2"/>
  <text x="565" y="328" text-anchor="middle" fill="#1a3a5c" font-size="14" font-weight="bold">4. Mock</text>
  <text x="565" y="348" text-anchor="middle" fill="#1a3a5c" font-size="13">Generation 模拟题</text>

  <!-- Connectors -->
  <line x1="190" y1="132" x2="250" y2="200" stroke="#1a3a5c" stroke-width="2"/>
  <line x1="490" y1="132" x2="430" y2="200" stroke="#1a3a5c" stroke-width="2"/>
  <line x1="190" y1="332" x2="250" y2="250" stroke="#1a3a5c" stroke-width="2"/>
  <line x1="490" y1="332" x2="430" y2="250" stroke="#1a3a5c" stroke-width="2"/>

  <!-- Authoritative foundation -->
  <rect x="150" y="392" width="380" height="48" rx="9" fill="#1a3a5c"/>
  <text x="340" y="414" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Authoritative Foundation 权威溯源</text>
  <text x="340" y="432" text-anchor="middle" fill="#c9d6e3" font-size="11">NHC-style Syllabus · Official Textbooks · Statutes · Judicial Interpretations · Guiding Cases</text>
  <line x1="340" y1="250" x2="340" y2="392" stroke="#c9a227" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
