<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="Segoe UI, Arial, sans-serif" width="680" height="480">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3a5c"/><stop offset="1" stop-color="#122a44"/>
    </linearGradient>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a3a5c"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#f5f7fa"/>
  <rect x="0" y="0" width="680" height="52" fill="url(#navy)"/>
  <text x="340" y="33" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Study Workflow 备考全流程</text>

  <!-- Phase 1 -->
  <rect x="40" y="90" width="290" height="70" rx="10" fill="#ffffff" stroke="#1a3a5c" stroke-width="2"/>
  <text x="185" y="116" text-anchor="middle" fill="#1a3a5c" font-size="14" font-weight="bold">Phase 1 · Foundation 基础</text>
  <text x="185" y="138" text-anchor="middle" fill="#5a6b7b" font-size="12">18科目通读 · 框架图 · 考点卡</text>

  <!-- Phase 2 -->
  <rect x="350" y="90" width="290" height="70" rx="10" fill="#ffffff" stroke="#1a3a5c" stroke-width="2"/>
  <text x="495" y="116" text-anchor="middle" fill="#1a3a5c" font-size="14" font-weight="bold">Phase 2 · Drill 强化</text>
  <text x="495" y="138" text-anchor="middle" fill="#5a6b7b" font-size="12">客观题分科刷 · 错题本 · 模考</text>

  <!-- Phase 3 -->
  <rect x="40" y="200" width="290" height="70" rx="10" fill="#ffffff" stroke="#1a3a5c" stroke-width="2"/>
  <text x="185" y="226" text-anchor="middle" fill="#1a3a5c" font-size="14" font-weight="bold">Phase 3 · Objective Exam 客观题</text>
  <text x="185" y="248" text-anchor="middle" fill="#5a6b7b" font-size="12">参加客观题考试 → 合格</text>

  <!-- Phase 4 -->
  <rect x="350" y="200" width="290" height="70" rx="10" fill="#ffffff" stroke="#1a3a5c" stroke-width="2"/>
  <text x="495" y="226" text-anchor="middle" fill="#1a3a5c" font-size="14" font-weight="bold">Phase 4 · Subjective 主观专项</text>
  <text x="495" y="248" text-anchor="middle" fill="#5a6b7b" font-size="12">案例/文书/论述 · 法条检索</text>

  <!-- Phase 5 -->
  <rect x="40" y="310" width="290" height="70" rx="10" fill="#c9a227"/>
  <text x="185" y="336" text-anchor="middle" fill="#1a2233" font-size="14" font-weight="bold">Phase 5 · Subjective Exam 主观题</text>
  <text x="185" y="358" text-anchor="middle" fill="#5a4a08" font-size="12">参加主观题考试 → 通过</text>

  <!-- Phase 6 -->
  <rect x="350" y="310" width="290" height="70" rx="10" fill="url(#navy)"/>
  <text x="495" y="336" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Phase 6 · Qualified 拿证</text>
  <text x="495" y="358" text-anchor="middle" fill="#c9d6e3" font-size="12">法律职业资格证书</text>

  <!-- connectors -->
  <line x1="330" y1="125" x2="348" y2="125" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="185" y1="160" x2="185" y2="198" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="495" y1="160" x2="495" y2="198" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="330" y1="235" x2="348" y2="235" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="185" y1="270" x2="185" y2="308" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="495" y1="270" x2="495" y2="308" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="330" y1="345" x2="348" y2="345" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- feedback loop -->
  <path d="M185 380 L185 430 L640 430 L640 345" fill="none" stroke="#c9a227" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow4)"/>
  <text x="420" y="448" text-anchor="middle" fill="#8a6d10" font-size="11">未通过则回到对应阶段复盘</text>
</svg>
