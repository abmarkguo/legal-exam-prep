<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3a5c"/><stop offset="1" stop-color="#122a44"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a3a5c"/>
    </marker>
  </defs>
  <rect width="680" height="460" fill="#f5f7fa"/>
  <rect x="0" y="0" width="680" height="52" fill="url(#navy)"/>
  <text x="340" y="33" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Knowledge Point Lookup 考点速查流程</text>

  <rect x="60" y="100" width="200" height="60" rx="10" fill="#ffffff" stroke="#1a3a5c" stroke-width="2"/>
  <text x="160" y="124" text-anchor="middle" fill="#1a3a5c" font-size="14" font-weight="bold">Query 提问</text>
  <text x="160" y="144" text-anchor="middle" fill="#5a6b7b" font-size="12">科目 / 考点 / 法条</text>

  <rect x="320" y="100" width="200" height="60" rx="10" fill="#ffffff" stroke="#1a3a5c" stroke-width="2"/>
  <text x="420" y="124" text-anchor="middle" fill="#1a3a5c" font-size="14" font-weight="bold">Retrieve 检索</text>
  <text x="420" y="144" text-anchor="middle" fill="#5a6b7b" font-size="12">高频考点库 / 大纲</text>

  <rect x="540" y="100" width="100" height="60" rx="10" fill="#1a3a5c"/>
  <text x="590" y="124" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Hit?</text>
  <text x="590" y="144" text-anchor="middle" fill="#c9d6e3" font-size="11">命中?</text>

  <line x1="260" y1="130" x2="318" y2="130" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="130" x2="538" y2="130" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- No path -->
  <path d="M590 160 L590 240 L420 240" fill="none" stroke="#c9a227" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="228" fill="#8a6d10" font-size="11">No → build card</text>

  <rect x="120" y="280" width="220" height="120" rx="10" fill="#eef3f8" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="230" y="306" text-anchor="middle" fill="#1a3a5c" font-size="14" font-weight="bold">Knowledge Card 考点卡</text>
  <text x="140" y="332" fill="#3a4a5a" font-size="12">• 核心要件 (速记)</text>
  <text x="140" y="352" fill="#3a4a5a" font-size="12">• 法条依据 (L1–L4)</text>
  <text x="140" y="372" fill="#3a4a5a" font-size="12">• 易混淆点</text>
  <text x="140" y="392" fill="#3a4a5a" font-size="12">• 真题/模拟链接</text>

  <rect x="400" y="280" width="200" height="120" rx="10" fill="#fff4d6" stroke="#c9a227" stroke-width="1.5"/>
  <text x="500" y="306" text-anchor="middle" fill="#8a6d10" font-size="14" font-weight="bold">Traceability 溯源</text>
  <text x="416" y="332" fill="#6a5410" font-size="12">L1 法律</text>
  <text x="416" y="352" fill="#6a5410" font-size="12">L2 司法解释</text>
  <text x="416" y="372" fill="#6a5410" font-size="12">L4 大纲/教材</text>
  <text x="416" y="392" fill="#6a5410" font-size="12">L5 指导性案例</text>

  <line x1="340" y1="340" x2="398" y2="340" stroke="#1a3a5c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="368" y="330" fill="#1a3a5c" font-size="11">Yes</text>
</svg>
